version: '3.8'

services:
  webserver:
    image: nginx:alpine
    container_name: tiket_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
    command: sh -c "printf 'server { listen 80; index index.php index.html; root /var/www/public; location / { try_files \$$uri \$$uri/ /index.php?\$$query_string; } location ~ \\.php$ { include fastcgi_params; fastcgi_pass app:9000; fastcgi_index index.php; fastcgi_param SCRIPT_FILENAME \$$document_root\$$fastcgi_script_name; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - app
    networks:
      - tiket-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiket_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - tiket-network

  db:
    image: mysql:8.0
    container_name: tiket_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_tiket_online
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: password
      MYSQL_USER: user
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - tiket-network

networks:
  tiket-network:
    driver: bridge

volumes:
  dbdata:
    driver: local